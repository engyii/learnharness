name: Container image

# Builds the image on every pull request and pushes it to GitHub Container
# Registry from main (tag `latest`) and from version tags.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            learnharness:test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name lh -p 3000:3000 learnharness:test
          for _ in $(seq 30); do
            curl -fsS -o /dev/null http://127.0.0.1:3000/api/settings && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/api/settings
          docker exec lh test -x /usr/bin/chromium
          docker logs lh
          docker rm -f lh
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name != 'pull_request'
        run: docker push --all-tags "$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
